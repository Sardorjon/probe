@if (data().length > 0) {
  <section class="grid gap-4 my-8 sm:grid-cols-2 lg:grid-cols-4">
    <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Total Revenue</p>
      <p class="mt-2 text-2xl font-bold text-slate-950">
        {{ formattedTotalRevenue() }}
      </p>
    </article>

    <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Total Cost</p>
      <p class="mt-2 text-2xl font-bold text-slate-950">
        {{ formattedTotalCost() }}
      </p>
    </article>

    <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Total Users</p>
      <p class="mt-2 text-2xl font-bold text-slate-950">
        {{ formattedTotalUsers() }}
      </p>
    </article>

    <article class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Average Conversion Rate</p>
      <p class="mt-2 text-2xl font-bold text-slate-950">
        {{ formattedAverageConversionRate() }}
      </p>
    </article>
  </section>
} @else {
  <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <article
      class="rounded-2xl border border-dashed border-slate-300 bg-white p-4 text-sm text-slate-500"
    >
      No stats available.
    </article>
  </section>
}
