@if (data().length > 0) {
  <section class="rounded-2xl my-8 border border-slate-200 bg-white p-4 shadow-sm">
    <div class="mb-4 flex items-start justify-between gap-4">
      <div>
        <h2 class="text-sm font-semibold text-slate-950">Revenue</h2>

        <p class="mt-1 text-xs text-slate-500">Revenue trend over time</p>
      </div>

      <div class="text-right">
        <p class="text-xs text-slate-500">Max</p>
        <p class="text-sm font-semibold text-slate-950">
          {{ maxRevenueLabel() }}
        </p>
      </div>
    </div>

    <div class="w-full overflow-x-auto">
      <svg
        [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
        class="h-72 w-full min-w-[640px]"
        role="img"
        aria-label="Revenue line chart"
      >
        <line
          [attr.x1]="32"
          [attr.y1]="32"
          [attr.x2]="32"
          [attr.y2]="height() - 32"
          class="stroke-slate-200"
          stroke-width="1"
        />

        <line
          [attr.x1]="32"
          [attr.y1]="height() - 32"
          [attr.x2]="width() - 32"
          [attr.y2]="height() - 32"
          class="stroke-slate-200"
          stroke-width="1"
        />

        <path [attr.d]="areaPath()" class="fill-slate-100" />

        <path
          [attr.d]="linePath()"
          class="fill-none stroke-slate-900"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        @for (point of points(); track point.date) {
          <circle
            [attr.cx]="point.x"
            [attr.cy]="point.y"
            r="3"
            class="fill-white stroke-slate-900"
            stroke-width="2"
          >
            <title>{{ point.date }} — {{ point.revenue }}</title>
          </circle>
        }

        <text [attr.x]="32" [attr.y]="20" class="fill-slate-500 text-[11px]">
          {{ maxRevenueLabel() }}
        </text>

        <text [attr.x]="32" [attr.y]="height() - 8" class="fill-slate-500 text-[11px]">
          {{ minRevenueLabel() }}
        </text>

        <text [attr.x]="32" [attr.y]="height() - 8" dy="16" class="fill-slate-500 text-[11px]">
          {{ startLabel() }}
        </text>

        <text
          [attr.x]="width() - 32"
          [attr.y]="height() - 8"
          dy="16"
          text-anchor="end"
          class="fill-slate-500 text-[11px]"
        >
          {{ endLabel() }}
        </text>
      </svg>
    </div>
  </section>
} @else {
  <section
    class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-slate-500"
  >
    No revenue data available.
  </section>
}
